                  - paragraph [ref=e173]: 商务礼仪：新人的第一本职业素养手册
                  - heading "第二节：职业形象塑造 —— 让别人第一眼就信任你" [level=2] [ref=e251]
                - generic [ref=e175]:
                  - heading "引子" [level=2] [ref=e176]
                  - paragraph [ref=e177]: 某公司销售总监讲过一件事。他面试一个各方面条件都不错的小伙子，聊了半小时，专业过硬，对答清楚。但最终他没要这个人。HR问他为什么，他说："他的皮鞋上有一层灰。"
                  - paragraph [ref=e178]: HR觉得这个理由说不出口。但销售总监坚持：一个来面试销售经理的人，连自己皮鞋上的灰都看不见，你指望他看得见客户的真实需求吗？
                  - paragraph [ref=e179]: 这个故事有没有过度解读的成分？有。但它揭示了一个商业社会的默认规则：别人用显微镜审视你的细节，你对此一无所知。
                  - paragraph [ref=e180]: 本节的任务，就是把那面显微镜交给你。从今天起，你不需要猜别人在看什么。
                  - heading "着装的TPO原则：穿对衣服的第一性原理" [level=2] [ref=e252]
                  - paragraph [ref=e181]: "\"今天穿什么\"这个问题的正确答案，从来不在衣柜里，而在三个英文字母里——TPO。"
                  - paragraph [ref=e182]: TPO是Time（时间）、Place（地点）、Object（目的）的缩写，是国际通行的着装第一准则。它不是一条建议，而是一套决策框架。任何一个商务场合的着装问题，都可以用TPO三问来解：
                  - paragraph [ref=e184]: 第一问：T——现在是什么时间？四季更替决定了面料的厚薄深浅，但TPO中的"时间"远不止温度。它还包含时代感——你穿的西装是今年在裁缝店做的，还是十年前的款式、垫肩厚得像橄榄球运动员？它还包含一天中的时段——同样的女士，白天拜访客户穿正式套装，晚上参加鸡尾酒会同一套衣服就不够了：换一双高跟鞋、加一条丝巾、添一件有光泽的配饰，着装就完成了"从白天到夜晚"的切换。一套质地上乘的深色西装能让男士包打大半场合，但女士的着装则要切实随时段而变——这是商务着装中一个常被忽视的性别差异。
                  - paragraph [ref=e185]: 第二问：P——这是什么地方？在自家客厅接待朋友，穿舒适整洁的休闲服是得体；去公司拜访客户，职业套装是标配；进入教堂寺庙，穿过露过短的服装则是对场所的不敬。同样的你，同样的星期三下午，在不同的地点，正确答案完全不同。"衣冠不整、低胸露背者不宜进入博物馆"——培训材料里这句看似常识的提醒，恰恰说明很多人没有把"场合"真正放进自己的穿衣决策里。
                  - paragraph [ref=e186]: 第三问：O——你今天的目标是什么？你是去谈判、汇报、面试、还是参加团建？谈判需要权威感——深色系、利落剪裁、低装饰性。汇报需要可信赖感——海蓝色或灰色套装是保险选择。团建需要亲和力——休闲西装或商务休闲的尺度在此正好。培训材料中有一个实用的建议：你穿什么最好的线索，来自你的上司穿什么。观察公司里中高层同事的穿衣风格，然后朝着那个方向做你的版本。如果他们每天西装领带，你就别穿圆领T恤配运动鞋。
                  - paragraph [ref=e187]: TPO本质上是一种"场景翻译能力"。不会穿的人在想"我有什么衣服"，会穿的人在想"这个场景需要什么信号"。
                  - heading "男士正装：从颜色到扣子的全维规范" [level=2] [ref=e253]
                  - heading "西装——藏蓝色是你的第一套盔甲" [level=3] [ref=e254]
                  - paragraph [ref=e188]: 男士西装的第一条密码：黑色不是首选。传统男士正装的默认色是藏蓝色和深灰色。黑色西装在西方礼仪中的首要用途是丧葬，次要用作正式礼服。一个穿黑色西装去拜访客户的新人，可能无意间传递了一个"沉重"的情绪信号，而自己浑然不觉。
                  - paragraph [ref=e189]: 面料上，首选毛料。不要用皮、麻、丝、棉。日版西装对亚洲男人的体型最友好，肩宽和腰线的比例经过针对性调整。
                  - paragraph [ref=e191]: 西装的核心在于合身度。培训材料中列出了几个硬指标：肩部要完美贴合，不能像借来的——这是西装合身与否的命门；外套袖口在手腕以上1到2厘米，确保衬衣袖子能露出来；裤脚刚好盖在鞋面上，不露袜子，裤长以到鞋跟处为准；裤腰前低后高，剪裁随人体的自然曲线；裤线必须笔直——这道线是立体感和精气神的来源，没有裤线的西裤像一块裹在腿上的布。
                  - paragraph [ref=e192]: 三色原则：全身的颜色不超过三种。三一定律：皮鞋、皮带、公文包三个配件保持同一个颜色（首选黑色）。这些规则曾被概括为"三个三"——三色原则、三一定律、三大禁忌。三大禁忌指的是：袖口商标不拆（穿着新买的西装满街走，袖口还挂着品牌标签——这是新手最高频的死法）、正规场合穿白袜子（除非你穿的是白西装白皮鞋，否则白袜子在深色西装和黑皮鞋之间画了一条刺眼的分界线）、夹克配领带或者短袖衬衫配领带（这两种搭配属于"对西装没理解"级的错误）。
                  - paragraph [ref=e193]: 西装纽扣的扣法有自己的语法：一粒扣西装，可扣可不扣；两粒扣西装，只扣上面那一粒；三粒扣西装，扣上面两粒或只扣中间一粒；四粒扣西装，扣中间两粒。坐下的时候解开扣子，站起来的时候扣上——这是一个动作，更是一个信号：你知道怎么穿，你在意这个场合。
                  - paragraph [ref=e194]: 西装的口袋不是储物空间。上衣口袋放了东西——哪怕是一个薄薄的名片夹——西装的线条立刻被破坏。腰间更不能挂钥匙和手机。"一个有社会地位的人，在大庭广众之前腰上是不挂任何东西的。"这句话来自涉外礼仪的行话，打在每一个习惯把钥匙串别在腰上的男士脸上。
                  - heading "衬衫——细节都在露出来的那1.5厘米里" [level=3] [ref=e255]
                  - paragraph [ref=e195]: "\"白衬衣是男士永远的时装。\"这句话的意思不是让你只穿白衬衫，而是说白衬衫是唯一一件永远不会出错的单品。"
                  - paragraph [ref=e196]: 衬衫的合体标准：系上最上面一粒扣子后，领口能伸进去一到两个手指。太紧勒脖子，太松显得羸弱——尤其是脖子细长的人，领口一大，整个人看起来像一根没立稳的稻草。
                  - paragraph [ref=e197]: 两个"1.5厘米"是衬衫的灵魂数据：衬衣领子露在西服领子外1.5厘米左右；抬起手臂时，衬衣袖口露出西服袖口外1.5厘米左右。这两个"露出来"的功能非常直白——保护西装的领口和袖口不被皮肤直接摩擦弄脏，因为衬衫随时洗，西装不能。但它们同时创造了一个视觉层次：领口那一条白边和袖口那一截白边，是男士正装最朴素也最有力的装饰线。
                  - paragraph [ref=e198]: 衬衣下摆必须扎进裤腰。正装场合绝对不能选短袖衬衫——这个禁忌背后的道理不止于"丑"。从心理学角度，一个人在对方面前暴露的皮肤越少，心理地位越占优势。商务场合是谈判和博弈，不是表示亲近的场所，所以长袖是默认配置。衬衣里面不宜穿保暖内衣或其他打底衫——影响线条。唯一可以穿的是背心。衬衣口袋里不要放东西——零钱、名片、烟盒都会在胸前鼓起一个毫不体面的鼓包。如果一定要放，只能放一支高级钢笔。不是圆珠笔，不是铅笔，是钢笔。
                  - heading "领带——你全身上下最容易被记住的那一块" [level=3] [ref=e256]
                  - paragraph [ref=e200]: 美国形象设计大师莫利有一句断言："无论你喜欢与否，领带比你身上任何部分都能让人们判断你——你的可信度、个性和能力。"
                  - paragraph [ref=e201]: 选领带的第一个原则：颜色不要浅于衬衣。蓝色、灰色、紫色是安全区。面料以真丝、纯毛为佳。"两个单色、一个图案"是西服套装、衬衣、领带三者之间的黄金搭配法则——其中至少两个是纯色，最多一个有图案。如果领带带了斜纹，西装和衬衫就得素净；如果西装是条纹的，领带和衬衫就收起来。三者之中最好有一个颜色"跳"出来，不要全身融为一团。
                  - paragraph [ref=e202]: "\"深浅交错\"是穿出层次感的关键：深色西装配浅色衬衫，领带选鲜艳或中深色；中深色西装配浅色衬衫，领带用深色；浅色西装配中深色衬衫，领带用深色。这个节奏一旦掌握，三件衣服就能搭出几十套不会出错的组合。"
                  - paragraph [ref=e204]: 长度是领带的命。站立时，领带下摆刚好在皮带扣上端或皮带扣下端1到1.5厘米处。短了滑稽，长了邋遢。领带结的大小要和衬衫领口的角度相匹配——宽角领打温莎结，窄角领打半温莎或普通结。打好之后，领带结应该有一个浅浅的凹痕，行话叫"男人的酒窝"。
                  - paragraph [ref=e206]: 领带夹在普通商务场合并不需要。如果使用，夹在七粒扣衬衫自上而下的第四粒和第五粒之间，不能外露于西装之外。领带夹在今天更多属于VIP接待或特殊制服场景（比如保镖需要防止领带乱飞）。
                  - heading "皮带、鞋袜与口袋管理" [level=3] [ref=e257]
                  - paragraph [ref=e208]: 皮带宽度大约3厘米。皮带和吊带不同时使用。皮带选择上，黑色可以配任何颜色的裤子，是最稳妥的投资。
                  - paragraph [ref=e209]: 皮鞋以深色为主：黑色、棕色或灰色。黑色的皮鞋配任何西装都不会出错。鞋面干净，跟不要太高。不要穿太陈旧的皮鞋——一双布满折痕、鞋面磨损的旧皮鞋，足以让你上半身所有的精心准备归零。
                  - paragraph [ref=e211]: 袜子是男士着装中最容易被忽略的"最后一公里"。核心原则：袜子的颜色要和裤子或皮鞋一致，让腿和脚在视觉上形成一个完整整体。周一穿藏蓝色西装和黑皮鞋，袜子选深蓝色或黑色。周二换银灰色套装和咖啡色皮鞋，袜子换成深灰色或咖啡色。白袜子是正规场合的灾难，除非你穿白西装白皮鞋。长度方面，必须是中长袜——坐下来的时候，袜子和裤腿之间露出一截毛茸茸的小腿，这是男士商务形象中最经典的"无心之过"。棉袜为主，忌穿尼龙丝袜。
                  - heading "女士职业着装：权威感与女性气质的平衡" [level=2] [ref=e258]
                  - heading "套装——越深越正式" [level=3] [ref=e259]
                  - paragraph [ref=e212]: 女士职业装的选择比男士复杂一个数量级，但核心规则同样清晰：正式场合以西式套装为主。黑色、海蓝色、灰色是职业女性的三大基石色。红色传递闯劲和存在感，海蓝色传递可信赖感，灰色传递保守稳健，黑色传递精致与权威。这些颜色可以和充满柔和女性气质的色调——冰蓝色、淡紫色、粉红色、象牙色——进行搭配，让职业感中融入适度的亲和力，而不是把自己穿成一块钢板。
                  - paragraph [ref=e213]: 套裙比套裤更正式。国际上有一个通行的判断："越深越正式，尤其适用于大型会议。"套裤干练，适合谈判；套裙端庄，适合正式的客户拜访和会议场合。裙长以离膝盖一个拳头的长度为基准——太长显得保守呆板，太短则走向了轻浮的极端。
                  - paragraph [ref=e214]: 女士裙装有四条不可触碰的红线：皮裙——材质本身传递的信号和商务场合严重冲突；裙子、鞋子、袜子三者颜色不协调；"三截腿"——裙子一截、丝袜一截、鞋子一截，腿在视觉上被切成了三段，这是破坏整体感最有效的方式之一；光腿穿职业裙，或配渔网袜——这两种穿法暴露的不只是腿部，更是对场合的误判。
                  - paragraph [ref=e215]: 女士着装"六不露"原则可以作为一套快速安检清单：不暴露胸部、不暴露肩部、不暴露腰部、不暴露背部、不暴露脚趾、不暴露脚跟。再加上一条——不过分透视，内衣的颜色和款式不能被外面看到。这六加一不是束缚女性，而是保护女性在商务场合的"职业身份"不被服装的信号噪声所覆盖。
                  - paragraph [ref=e216]: 上衣衣扣全部系好。衬衫最上一粒可系可不系，但下面的都要系。内衣选肉色或白色，面料避免蕾丝。尽可能穿平角底裤，避免内衣痕迹线破坏套裙背面的线条。
                  - heading "色彩、配饰与鞋袜" [level=3] [ref=e260]
                  - paragraph [ref=e217]: 职业女性着装的色彩搭配有一个底层逻辑：衣服是背景，人才是主角。颜色太多、太跳，对方的注意力从你的脸转移到你的衣服上——你就是在做一场自毁式演讲。以冷色调为主，体现出典雅、端庄与稳重。
                  - paragraph [ref=e218]: 配饰的四个硬指标：符合身份——任何会"炫富、炫耀性别优势"的首饰都不能戴，职务身份优先于个人审美；以少为佳——全身上下不多于三种，每种不多于两件，超过三种了就有"远看像圣诞树，近看像杂货铺"的嫌疑；同质同色——如果戴了金色耳钉，手镯就用金色，别金银混搭；符合习俗——比如十字架形挂件在国际交往中不宜佩戴。
                  - paragraph [ref=e220]: 耳环推荐钻石小耳钉或细白金链配小吊坠。不要选会晃动的大耳环——对方会不自控地盯着你耳畔那个摇摆的东西，你的PPT和你的方案在他大脑里成了背景音。"如果今天我戴了这种晃动的耳环，大家注意力都在我的耳环上而不是课程上了。"培训师在备注里写下的这句话，是配饰法则的最佳注脚。
                  - paragraph [ref=e221]: 鞋子必须是船型，不能露脚趾。鱼嘴鞋露两个脚趾头，同样不适合；凉鞋和人字拖更是禁区。鞋跟高度适中，装饰物不宜过多。鞋面干净，颜色不要过于鲜艳。鞋子颜色必须深于衣服颜色——如果比服装浅，那就要和其他配饰颜色统一。
                  - paragraph [ref=e222]: 丝袜是女士职业装的必备单品。颜色选肉色、黑色或浅灰色，连裤袜为佳。包里永远备一双丝袜——袜子破了的一瞬间，你需要三分钟内解决问题，而不是尴尬地躲进洗手间祈祷没人注意到。一个小窍门：新丝袜穿之前放冰箱冻一冻，第一次洗时加一点醋，能有效延长寿命。
                  - paragraph [ref=e223]: 包必须是质地好、款式庄重的款式。不能拎纸袋或塑料袋，不能背双肩包，不要只拿一个化妆包。包里面要放的东西，除了那一双备用丝袜之外，建议备一支签字笔、一张名片——因为你永远不知道什么时候需要它。
                  - heading "妆容与香水" [level=3] [ref=e261]
                  - paragraph [ref=e224]: 女士的面部化妆，一个总则是四句话：自然、美化、避人、协调。
                  - paragraph [ref=e225]: "\"自然\"的意思是妆成有却无。经过了修饰，但看不出修饰的痕迹。\"美化\"是目标——突出五官中最美的部分，掩盖或矫正缺陷，按\"三庭五眼\"的比例关系去处理。\"避人\"是一条容易被忽视的规矩：补妆、整理妆面不能在公共场合进行，更不能在工作时间内当着客户的面照镜子或拨弄头发。修饰避人，这是自尊和尊人的底线。\"协调\"是指妆容和服装、场合、身份之间的一致性。"
                  - paragraph [ref=e226]: 化妆是自尊自爱的表现，是尊重他人的体现。一个人的面容是她在商务场合送出的第一份精神名片。不化妆——尤其是面容显得疲惫、暗淡的时候——传递给对方的信息是"这个会面没有让我兴奋"或者"我对自己的要求不高"。淡妆为宜、自然和谐，这是商务妆容的铁律。
                  - paragraph [ref=e227]: 香水使用有一道看不见的边界：50厘米。如果你离开办公桌半小时后，你座位附近还飘着你的香水味，那就是过量了。香水的社交功能是——走近你的时候闻到一丝若有若无的气息，觉得舒服，而不是让整个会议室都知道你刚才来过。香味过浓的香水不但不会增添魅力，反而是一种对他人嗅觉的压迫。
                  - heading "仪容仪表的微观战场" [level=2] [ref=e262]
                  - heading "头发是一个人精神状态的旗杆" [level=3] [ref=e263]
                  - paragraph [ref=e229]: "\"整洁得体大方的发式易给人留下神清气爽的美感，而蓬头垢面难免使人联想起乞丐。\"培训材料里这句不留情面的判断，说出了头发在仪容中的权重——它是整个形象最顶部的一笔，也是最容易被别人从远处一眼锁定的元素。"
                  - paragraph [ref=e230]: 男士的头发规矩概括为三句话：前发不遮眉，侧发不掩耳，后发不及领。不可剃光（除非有特殊情况，但商务场合光头传递的信号过于强烈），也不可过长。经常洗、经常理，避免油腻和头屑——如果深色西装上落了一层白屑，任何走近你的人都无法专注在你说的内容上。
                  - paragraph [ref=e231]: 女士在重要场合和工作场合，长发不要披散过肩。"长发不过肩"是一个硬指标。头发干净整洁是底线，发型选择要考虑年龄、职业和脸型特征，不求前卫，但求得体。随着女性年龄增长，头发的长度也相应缩短——30到35岁之后，最多把头发留到肩部，这是通行的职业形象规则。
                  - heading "面部管理的五张考卷" [level=3] [ref=e264]
                  - paragraph [ref=e232]: 口腔卫生是第一优先级。饭后及时刷牙、漱口。出去见客户或参加商务宴请之前，不吃葱、蒜、韭菜等带有刺激气味的食物。口无异味、无异物——这两个"无"是任何商务交谈的基础。
                  - paragraph [ref=e265]: 眼睛区域：保持清洁，没有分泌物，避免眼睛布满血丝。一个红着眼眶去见客户的销售，所有关于产品的承诺都会被对方在心里打个折扣。
                  - paragraph [ref=e266]: 鼻腔：鼻毛不能探头探脑。年纪稍长的男士尤其要注意，这在别人看来是一个极其扎眼但又不便提醒的细节。
                  - paragraph [ref=e267]: 胡须：男士每日一理，刮干净。胡茬子给人的信号是"我今天起晚了"或者"我比较懒散"，两条都不是你愿意在客户面前传递的。
                  - paragraph [ref=e268]: 指甲：清洁、定期修剪。指甲油颜色不应过于亮丽——这意味着别人的注意力集中到你的指尖而不是你的脸上。透明色是全民安全牌。指甲太长、指甲油太红——用培训材料里的话说——"都会引起别人的侧目"。
                  - heading "体味：一场不能输的隐形战" [level=3] [ref=e269]
                  - paragraph [ref=e270]: 体味管理是所有仪容项目中最不容商量的一项。如果本身体味较重，必须注意清洁频率和换洗衣服。运动之后不能带着汗味出现在工作和商务场合。用一点淡雅的香水或止汗剂是可以接受的，但不可用浓香去压汗味——两种味道混合之后往往是灾难级的。
                  - paragraph [ref=e271]: 培训材料中有一句直白到近乎冒犯的论述："浑身是毛和体味的人种当然要用长袖和香水来遮羞。"这句话的上下文是在解释为什么短袖衬衫不符合严谨的国际礼仪标准，但它同时点出了一个在商务场合不谈的事实——体味管理在古代是不分国籍的生存技能，在今天是不分行业的职业门槛。
                  - heading "形体语言：你的身体在替你说话" [level=2] [ref=e272]
                  - heading "站姿——一个人有没有底气，看他怎么站" [level=3] [ref=e273]
                  - paragraph [ref=e274]: "\"站如松\"这三个字不是文人的诗意比喻，是极其精准的解剖学描述：从正面看，以鼻尖到地面画一条垂直线，人体在这条线的两侧完全对称——肩膀平齐、脊柱挺直、重心稳定。这种站姿传递的信号是：我是一个可以在压力下保持平衡的人。"
                  - paragraph [ref=e275]: 标准站姿的五项拆解：挺胸、收腹、腰立直；下颌微收；双目平视前方；双臂自然下垂于体侧，手指自然弯曲；脚跟相靠，脚尖展开45度到60度。
                  - paragraph [ref=e276]: 男女站姿有一条关键区分：女士可以双脚呈小V字或丁字步，膝盖和脚后跟紧靠。两手在腹前交叠——左手在下、右手在上。男士两脚分开与肩同宽，两手自然下垂，或交叠放在身前，或背于身后。所谓"女生丁字脚，男生八字微开"，就是这条规则的口语版。
                  - paragraph [ref=e277]: 脚间距与肩同宽，脚尖微微向外——在这个区间内，人是稳定的；超过这个幅度，人就"散了"。
                  - paragraph [ref=e278]: 站姿练习有一个既简单又苛刻的方法：靠墙站立，让脚跟、臀部、后背、双肩、后脑五个点紧贴墙面，头上再顶一本书。每次坚持五到十分钟。练到某一个时刻，你不再需要墙和书也能站出同样的稳定感——那时候路过的每一个人看你一眼就能感觉到：这个人站得住。
                  - heading "坐姿——\"不满坐是谦恭\"" [level=3] [ref=e279]
                  - paragraph [ref=e280]: 入座的口诀是"左进左出"——从椅子的左侧进入，坐下；离开时也从左侧起立。这不仅仅是仪式感，它保证了你坐下和站起的动作都自然、不别扭，避免背对着某个重要的人以扭曲的姿势落座。
                  - paragraph [ref=e281]: 入座前，走到座位正面，再转身，右脚向后撤半步，轻稳坐下，收右脚。入座时要轻——不要一屁股砸下去让椅子发出怨声。坐椅子的三分之二，这是"不满坐"的标准。为什么不满坐是谦恭？因为你坐满了意味着你把自己安放得非常舒适，而"舒适"本身在社交落差中就是上位者的特权。坐三分之二，背部挺直，身体稍向前倾——这个微小的前倾角度传递的信号非常清晰：我重视这次谈话，我在听。
                  - paragraph [ref=e282]: 双腿自然弯曲，双脚平落地面。男士双膝稍稍分开，间距以一至两拳为度——正式场合要求两腿间刚好容下一拳。女士双膝必须并拢，脚可放中间或侧放。两腿并拢、同时向前、向左或向右放都是得体的选择。绝不跷二郎腿——如果一定要跷，收紧上面的腿，脚尖下压，千万不能用脚尖指向别人，更不能上下抖动。抖腿是商务场合最让人"说不出口但心里已经给你判了刑"的小动作。
                  - paragraph [ref=e283]: 双手放膝上或平放于两腿之间。不托腮、不玩弄任何物品。
                  - paragraph [ref=e284]: 起立时动作要轻，右脚向后撤半步，垂直站起，收右脚。离座后，把椅子轻轻抬回原位再放下——忌拖或推椅子，那一声刺耳的摩擦是对整个房间的打扰。
                  - heading "走姿——走路是你信心的可视化呈现" [level=3] [ref=e285]
                  - paragraph [ref=e286]: "\"走路的姿势往往最能体现一个人是否有信心。\"培训材料里这句话背后有一个日常观察：你可以穿得很精致，但如果走路时含胸驼背、脚步拖沓、左右摇晃、手臂乱甩——全身的精致都在十步之内被瓦解。反过来，一个衣着简洁的人如果走路挺拔稳定、步履轻捷、节奏均匀——他的气场可以压过全场。"
                  - paragraph [ref=e287]: 男士走姿要求稳定、矫健；女士要求轻盈、优雅。技术上拆解为：上身保持站姿标准，肩膀不要左右摇摆；身体重心稍向前倾，大腿动作幅度小，主要靠向前弹出小腿带动步伐；步幅约一只脚到一个半脚的长度；两腿间距要小，女性穿裙子时尽量走一条直线；脚尖脚跟与前进方向近乎一致，杜绝内八字和外八字；两臂在身体两侧自然摆动，手掌向内，手臂与身体的夹角在10度到15度之间；双眼平视前方，不要左顾右盼，更不要低头——"低头一般也拣不着钱"。
                  - paragraph [ref=e288]: 几个行走禁忌要牢记：不要走路时脚擦着地板——脚后跟拖地发出的声音是一种听觉上的"疲惫信号"。不要在他人后面走路时发出奇怪的笑声——你以为是活泼，对方听到的是某种不怀好意的暗示。在走廊通道要靠右而行，左边留给有急事的人。遇到客户不要抢行，侧身、微笑，说一句"您先请"。
                  - paragraph [ref=e289]: 引领客人时，站在对方左前方2到3步的距离，身体微侧向对方。手势用虚指不用实指——五指并拢、掌心向上、以肘为轴向外伸展，手臂与上体夹角30度左右，手肘夹角90到120度。千万不要伸一根食指指着方向说"那边"——这是商务场合最接近"骂人"的手势。
                  - heading "蹲姿——优雅不需要弯腰" [level=3] [ref=e290]
                  - paragraph [ref=e291]: 捡起掉在地上的东西，很多人下意识一弯腰、手一够。但这个动作在别人眼里是：弯腰、翘臀、姿态全无。正确做法是：先走到物品旁边，再下蹲。一脚在前、一脚在后，前脚全脚掌着地、小腿垂直于地面，后脚脚跟提起、脚掌着地。上身保持正直，动作轻、姿态稳。女士蹲下时，务必用手收拢裙子，防止走光。
                  - heading "表情与目光——你脸上最便宜的武器" [level=3] [ref=e292]
                  - paragraph [ref=e293]: "\"脸上性价比最高的是什么？\"某培训PPT上画了一个大大的笑脸，旁边标注：微笑。"
                  - paragraph [ref=e294]: 微笑是唯一一种不分国籍的通用语言。它的底层原理不是"礼仪要求你笑"，而是——你的笑容向对方发射了一个信号：我在你面前没有威胁，我愿意和你建立连接。这个信号在商务社交中就是一切的开端。
                  - paragraph [ref=e295]: 国际标准微笑：别人在离你三米的地方就能看到你的笑脸。嘴角微微上翘，露出上面的六到八颗牙齿。练习方法很简单——咬一根筷子，让嘴角的两侧都在筷子同一水平线上，保持十秒。然后对着镜子，把那个微笑保持三十秒以上。找到最满意的角度后反复固化。如果你容易笑僵，多练。
                  - paragraph [ref=e296]: 目光的规矩：与人谈话时，70%的时间要看着对方。不看对方是不礼貌，死盯对方是压迫。正确的视觉落点是对方眉与鼻梁之间的三角区——不远不近，刚好让两个人都在一个舒适的距离内。道别和握手时，目光移到对方的眼睛。每次目光交流的时间控制在3到5秒，不要用视线在对方身上来回扫描。看男士的时候视线不要高过对方的头顶（那是居高临下），看女士的时候视线不要下移（那是不尊重）。
                  - paragraph [ref=e297]: "\"眼到、口到、意到\"——礼仪三到。眼睛、语言、意念，少一个都是敷衍。"
                  - heading "形体禁忌清单：你在别人眼里是什么样子" [level=2] [ref=e298]
                  - paragraph [ref=e299]: 以下这些姿势和动作，你可以对着镜子做一遍，然后问自己一个问题：如果你是对面那个客户，你愿意和这个人签合同吗？
                  - paragraph [ref=e300]: 歪脖——脖子歪向一边，整个人看起来像一棵被风吹歪的树。斜肩——一个肩膀高、一个肩膀低，不对称感在视觉上等于"不稳定"。弓背——脊柱弯曲，胸腔塌陷，整个上半身在说"我没有精气神"。挺腹——肚子前挺、骨盆前倾，这是一种不自知的傲慢姿态，别人读到的信号是"这个人不太容易沟通"。撅臀——站姿中臀部过度后翘，破坏身体的垂直感。
