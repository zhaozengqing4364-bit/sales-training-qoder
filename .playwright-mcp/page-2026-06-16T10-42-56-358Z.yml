              - heading "参考表达" [level=2] [ref=e244]
              - paragraph [ref=e245]: 大家好，我是石犀的销售经理，今天用几分钟介绍我们数据流动治理方案。
              - paragraph [ref=e246]: 国家数据局成立后，数据要素市场化正在加速推进；等保新规也已经把数据安全纳入强制要求，数据安全有高风险项会直接影响等保通过。工信部也在推动大量企业做数据分类分级，所以合规是刚需，数据变现也是未来趋势。
              - paragraph [ref=e247]: 石犀的核心逻辑是“资产—用户—流动管控”。
              - paragraph [ref=e248]: 第一步是资产自动盘点。设备旁路接入交换机镜像口，不需要改业务系统，就能自动梳理应用系统、API 接口和数据库。比如汕头大学通过我们梳理出 1000 多个 API 资产，也发现了不少未知业务系统。
              - paragraph [ref=e249]: 第二步是 AI 分类分级。我们自研本地化 AI 模型，分类准确率超过 91%，3 分钟可以处理 10 万多个字段，把原来几个月的人工工作缩短到天级。
              - paragraph [ref=e250]: 第三步是风险监测和防护。平台可以实时识别弱密码、敏感数据泄露、API 未鉴权、越权访问、数据出境等风险，然后通过脱敏、水印、加密、访问控制等组件一键处置，不需要改业务代码。
              - paragraph [ref=e251]: 第四步是溯源审计。平台全量记录数据访问行为，一旦出事，可以追溯到谁、什么时间、通过什么方式访问了什么数据。北京卫健委就是用我们的溯源能力解决了其他厂家没定位出来的数据泄露追查问题。
              - paragraph [ref=e252]: 和传统安全设备堆叠不同，石犀是平台+组件模式。传统方案可能是脱敏一台、WAF 一台、审计一台，串起来之后单点故障多、扩容成本高。我们是一个平台，30 多个安全组件按需订阅，需要什么开通什么，不需要就取消。
              - paragraph [ref=e253]: 部署方式也比较灵活。镜像模式可以旁路无侵入，一般 1 到 3 天上线；代理模式可以解密 HTTPS 并做实时防护。平台支持信创环境，也有政府、医疗、金融、教育和企业客户案例。
              - paragraph [ref=e254]: 所以一句话总结，石犀帮客户看清楚数据资产、监控好数据流动、防得住数据风险、追得到泄露源头。下一步可以先选 1 到 2 个非核心系统做旁路扫描，几天内出一份数据安全风险评估报告，完全不影响现有业务。
