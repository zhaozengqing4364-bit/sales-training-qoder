name: Release Truth Gate

on:
  push:
    branches: [main, dev, 001-ai-practice-system]
  pull_request:
    branches: [main, dev, 001-ai-practice-system]
  schedule:
    - cron: "23 18 * * *"
  workflow_dispatch:
    inputs:
      require_ai_coach_real_provider:
        description: "Fail if the real AI Coach LLM credential is missing instead of recording a classified skip."
        required: false
        type: boolean
        default: false
      allow_ai_coach_credential_skip:
        description: "Allow a manual classified skip when real AI Coach LLM credentials are intentionally unavailable."
        required: false
        type: boolean
        default: false

jobs:
  release-truth:
    name: release-truth
    runs-on: ubuntu-latest
    timeout-minutes: 90

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: sales_training
        options: >-
          --health-cmd "pg_isready -U dev -d sales_training"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql+asyncpg://dev:dev@127.0.0.1:5432/sales_training
      REDIS_URL: redis://127.0.0.1:6379/0
      NEXT_PUBLIC_API_URL: http://localhost:3444/api/v1
      NEXT_PUBLIC_WS_URL: ws://localhost:3444
      SMOKE_ADMIN_EMAIL: admin@qoder.ai
      SMOKE_ADMIN_PASSWORD: change-me
      AUTH_SHARED_PASSWORD: change-me
      AUTO_START_INFRA: "0"
      PORTS_TO_CLEAN: 3444,3445
      PLAYWRIGHT_SKIP_BROWSER_INSTALL: "1"
      QUALITY_GATE_SELECTION_MODE: ${{ github.event_name == 'pull_request' && 'pr' || github.event_name == 'push' && 'push' || github.event_name == 'schedule' && 'schedule' || 'full' }}
      QUALITY_GATE_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || '' }}
      # Coverage line numbers must describe the checked-out tree. For PRs the
      # default checkout is GitHub's synthetic merge commit (`github.sha`), not
      # `pull_request.head.sha`.
      QUALITY_GATE_HEAD_SHA: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node from web/package-lock.json authority
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Python from backend/requirements.txt authority
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/pyproject.toml

      - name: Install repo-root authorities
        run: |
          npm --prefix web ci
          python -m venv backend/venv
          backend/venv/bin/pip install --upgrade pip
          backend/venv/bin/pip install -r backend/requirements.txt
          # Release-gate security scanners (declared in backend/pyproject.toml
          # [project.optional-dependencies] release-gate). verification_runner
          # treats these as hard-fail when missing, so CI MUST install them.
          # pip-audit replaces deprecated safety (check deprecated 2024-06;
          # scan requires login). Install via extras to reuse version pins.
          cd backend && venv/bin/pip install -e ".[release-gate]"

      - name: Install Playwright browser + system dependencies
        run: |
          cd web
          npx playwright install --with-deps chromium

      - name: Secret hygiene scan
        run: |
          python scripts/check_secret_hygiene.py

      - name: Critical full-stack quality gate
        run: |
          bash scripts/critical-quality-gate.sh

      - name: Upload T9 quality-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t9-quality-gate-evidence
          if-no-files-found: error
          path: |
            .sisyphus/evidence/task-9-quality-gate.txt
            .sisyphus/evidence/quality-test-selection.json
            .sisyphus/evidence/backend-coverage.json
            .sisyphus/evidence/changed-coverage-report.json
            .sisyphus/evidence/task-9-playwright-report.html
            .sisyphus/evidence/task-9-playwright-report/
            web/coverage/coverage-final.json
            web/coverage/coverage-summary.json

  newcomer-ai-coach-real-provider:
    name: newcomer-ai-coach-real-provider
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: sales_training
        options: >-
          --health-cmd "pg_isready -U dev -d sales_training"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql+asyncpg://dev:dev@127.0.0.1:5432/sales_training
      REDIS_URL: redis://127.0.0.1:6379/0
      NEXT_PUBLIC_API_URL: http://localhost:3444/api/v1
      NEXT_PUBLIC_WS_URL: ws://localhost:3444
      SMOKE_ADMIN_EMAIL: admin@qoder.ai
      SMOKE_ADMIN_PASSWORD: change-me
      AUTH_SHARED_PASSWORD: change-me
      AUTO_START_INFRA: "0"
      PORTS_TO_CLEAN: 3444,3445
      PLAYWRIGHT_SKIP_BROWSER_INSTALL: "1"
      CRITICAL_GATE_MODE: newcomer-ai-coach-real-provider
      NEWCOMER_AI_COACH_REAL_PROVIDER_REQUIRED: ${{ github.event_name == 'workflow_dispatch' && inputs.require_ai_coach_real_provider && '1' || '0' }}
      NEWCOMER_AI_COACH_REAL_PROVIDER_CREDENTIAL_SKIP_ALLOWED: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_ai_coach_credential_skip && '1' || '0' }}
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'openai' }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || vars.LLM_BASE_URL || 'https://api.openai.com/v1' }}
      LLM_MODEL: ${{ vars.LLM_MODEL || 'gpt-4o-mini' }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY || secrets.OPENAI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node from web/package-lock.json authority
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Python from backend/requirements.txt authority
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/pyproject.toml

      - name: Install repo-root authorities
        run: |
          npm --prefix web ci
          python -m venv backend/venv
          backend/venv/bin/pip install --upgrade pip
          backend/venv/bin/pip install -r backend/requirements.txt

      - name: Install Playwright browser + system dependencies
        run: |
          cd web
          npx playwright install --with-deps chromium

      - name: Newcomer AI Coach real provider release/nightly gate
        run: |
          bash scripts/critical-quality-gate.sh

      - name: Upload newcomer AI Coach real provider evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newcomer-ai-coach-real-provider-gate
          path: |
            .sisyphus/evidence/task-9-newcomer-ai-coach-real-provider-gate.txt
            .sisyphus/evidence/newcomer-ai-coach-real-provider-gate.json
            .sisyphus/evidence/newcomer-ai-coach-real-provider-runtime-audit.json
            .sisyphus/evidence/task-9-playwright-report.html
            .sisyphus/evidence/task-9-playwright-report/
