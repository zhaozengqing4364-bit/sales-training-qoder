<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>产品知识测验 · 销售训练原型</title>
  <link rel="stylesheet" href="_shared.css" />
  <style>
    .quiz-header {
      margin-bottom: 1rem;
    }
    .quiz-header__back {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      margin-bottom: 0.75rem;
      font-size: 0.875rem;
      font-weight: 600;
      color: #475569;
    }
    .quiz-header__back:hover {
      color: #0f172a;
    }
    .quiz-header__back svg {
      width: 1rem;
      height: 1rem;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }
    .progress-block {
      margin-bottom: 1.25rem;
    }
    .progress-block__row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 0.4rem;
      font-size: 0.8125rem;
    }
    .progress-block__label {
      font-weight: 600;
      color: #334155;
    }
    .progress-block__count {
      font-weight: 700;
      color: #0f172a;
      font-variant-numeric: tabular-nums;
    }
    .progress-block__track {
      height: 0.375rem;
      background: #e2e8f0;
      border-radius: 9999px;
      overflow: hidden;
    }
    .progress-block__fill {
      height: 100%;
      width: 25%;
      border-radius: 9999px;
      background: linear-gradient(90deg, #0f172a 0%, #334155 100%);
    }
    .question-shell {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 1.5rem;
      padding: 1.25rem 1.125rem 1rem;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
      margin-bottom: 5.5rem;
    }
    .question-meta {
      margin: 0 0 0.5rem;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #94a3b8;
    }
    .question-title {
      margin: 0 0 0.75rem;
      font-size: 1.0625rem;
      font-weight: 700;
      line-height: 1.45;
      color: #0f172a;
    }
    .question-stem {
      margin: 0 0 1.125rem;
      font-size: 0.9375rem;
      line-height: 1.65;
      color: #475569;
    }
    .option-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .option-card {
      position: relative;
      display: block;
      cursor: pointer;
    }
    .option-card input {
      position: absolute;
      opacity: 0;
      width: 1px;
      height: 1px;
      overflow: hidden;
    }
    .option-card__body {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      padding: 0.875rem 1rem;
      background: #fff;
      border: 2px solid #e2e8f0;
      border-radius: 1rem;
      font-size: 0.875rem;
      line-height: 1.5;
      color: #334155;
      transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
    }
    .option-card:hover .option-card__body {
      border-color: #cbd5e1;
      background: #f8fafc;
    }
    .option-card input:focus-visible + .option-card__body {
      outline: 2px solid #0f172a;
      outline-offset: 2px;
    }
    .option-card input:checked + .option-card__body {
      border-color: #0f172a;
      background: #f8fafc;
      box-shadow: 0 0 0 1px #0f172a;
    }
    .option-card__marker {
      flex-shrink: 0;
      width: 1.125rem;
      height: 1.125rem;
      margin-top: 0.1rem;
      border: 2px solid #cbd5e1;
      border-radius: 50%;
      background: #fff;
      transition: border-color 0.15s, background 0.15s;
    }
    .option-card input:checked + .option-card__body .option-card__marker {
      border-color: #0f172a;
      background: #0f172a;
      box-shadow: inset 0 0 0 3px #fff;
    }
    .option-card__label {
      flex: 1;
    }
    .option-card__label strong {
      display: block;
      margin-bottom: 0.15rem;
      font-weight: 600;
      color: #0f172a;
    }
    .sticky-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 20;
      padding: 0.75rem 1rem calc(0.75rem + env(safe-area-inset-bottom, 0px));
      background: rgba(248, 250, 252, 0.92);
      border-top: 1px solid #e2e8f0;
      backdrop-filter: blur(8px);
    }
    .sticky-bar__inner {
      max-width: 28rem;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    @media (min-width: 640px) {
      .sticky-bar__inner {
        max-width: 36rem;
      }
    }
    .sticky-bar__hint {
      margin: 0;
      font-size: 0.75rem;
      color: #64748b;
      text-align: center;
    }
    .page--quiz {
      padding-bottom: 7rem;
    }
  </style>
</head>
<body>
  <main class="page page--quiz">
    <nav class="top-nav" aria-label="原型导航">
      <a href="index.html">← 训练首页</a>
      <span class="sep">·</span>
      <a href="path-home.html">学习路径</a>
      <span class="sep">·</span>
      <a href="quiz-result.html">查看结果示意</a>
    </nav>

    <header class="quiz-header">
      <a class="quiz-header__back" href="path-home.html">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        返回本关 · 产品知识测验
      </a>
      <h1 class="page-title">产品知识测验</h1>
      <p class="page-subtitle">石犀数据安全 · 售前新人必修 · 单题作答，可随时返回路径查看关卡说明</p>
    </header>

    <div class="progress-block" role="group" aria-label="答题进度">
      <div class="progress-block__row">
        <span class="progress-block__label">当前进度</span>
        <span class="progress-block__count" aria-live="polite">第 3 题 / 共 12 题</span>
      </div>
      <div class="progress-block__track" aria-hidden="true">
        <div class="progress-block__fill"></div>
      </div>
    </div>

    <article class="question-shell" aria-labelledby="q-heading">
      <p class="question-meta" id="q-heading">单选题 · 8 分</p>
      <h2 class="question-title">跨域数据流动场景下的价值表达</h2>
      <p class="question-stem">
        某金融集团 CIO 在首次拜访中表示：「我们已有传统 DLP，为什么还需要石犀的数据流动治理平台？」
        作为售前新人，下列哪一句最能体现<strong>客户价值</strong>而非功能罗列？
      </p>

      <ul class="option-list" role="radiogroup" aria-label="请选择一项">
        <li>
          <label class="option-card">
            <input type="radio" name="answer" value="a" />
            <span class="option-card__body">
              <span class="option-card__marker" aria-hidden="true"></span>
              <span class="option-card__label">
                <strong>A</strong>
                我们支持 200+ 种数据源连接器，比竞品多 40%。
              </span>
            </span>
          </label>
        </li>
        <li>
          <label class="option-card">
            <input type="radio" name="answer" value="b" checked />
            <span class="option-card__body">
              <span class="option-card__marker" aria-hidden="true"></span>
              <span class="option-card__label">
                <strong>B</strong>
                DLP 侧重静态防泄漏；石犀把「谁、在什么业务场景、以何种方式流动数据」串成可审计链路，帮您把跨系统审批从周级压到日级，并降低合规暴露面。
              </span>
            </span>
          </label>
        </li>
        <li>
          <label class="option-card">
            <input type="radio" name="answer" value="c" />
            <span class="option-card__body">
              <span class="option-card__marker" aria-hidden="true"></span>
              <span class="option-card__label">
                <strong>C</strong>
                我们的 UI 更现代，实施周期通常 2 周即可完成 POC。
              </span>
            </span>
          </label>
        </li>
        <li>
          <label class="option-card">
            <input type="radio" name="answer" value="d" />
            <span class="option-card__body">
              <span class="option-card__marker" aria-hidden="true"></span>
              <span class="option-card__label">
                <strong>D</strong>
                建议先签三年框架合同，再安排技术交流。
              </span>
            </span>
          </label>
        </li>
      </ul>
    </article>

    <footer class="footer-disclaimer">
      UX 原型 · 非生产代码
    </footer>
  </main>

  <div class="sticky-bar" role="region" aria-label="提交操作">
    <div class="sticky-bar__inner">
      <p class="sticky-bar__hint">已选 1 项 · 提交后进入判分与解析页</p>
      <a class="btn btn-primary btn-block" href="quiz-result.html">提交本关答案</a>
    </div>
  </div>
</body>
</html>
